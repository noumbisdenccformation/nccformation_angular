steps:
  # Build Angular Frontend
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['install']
    dir: '.'
  
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: '.'
  
  # Deploy Frontend to Cloud Storage
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['cp', '-r', 'dist/ncc-frontend/*', 'gs://nccformation-frontend/']
  
  # Build Backend
  - name: 'gcr.io/cloud-builders/mvn'
    args: ['clean', 'package', '-DskipTests']
    dir: '.'
  
  # Build Docker image for backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ncc-backend:$COMMIT_SHA', '.']
  
  # Push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ncc-backend:$COMMIT_SHA']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: 
      - 'run'
      - 'deploy'
      - 'ncc-backend'
      - '--image=gcr.io/$PROJECT_ID/ncc-backend:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY